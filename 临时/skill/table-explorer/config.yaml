# 所有凭证从环境变量读取(见 skill 根目录 .env), 配置文件不保留明文。
db:
  impala_auth_mechanism: PLAIN
  impala_database: default
  impala_host: ${IMPALA_HOST}
  impala_password: ${IMPALA_PASSWORD}
  impala_port: ${IMPALA_PORT}
  impala_user: ${IMPALA_USER}
  starrocks_database: default
  starrocks_host: ${SA_SR_HOST}
  starrocks_password: ${SA_SR_PASSWORD}
  starrocks_port: ${SA_SR_PORT}
  starrocks_user: ${SA_SR_USER}
db_profiles:
  default:
    impala_auth_mechanism: PLAIN
    impala_database: default
    impala_host: ${IMPALA_HOST}
    impala_password: ${IMPALA_PASSWORD}
    impala_port: ${IMPALA_PORT}
    impala_user: ${IMPALA_USER}
explorer:
  default_sample_size: 100
  enum_threshold: 20
  key_field_patterns:
    foreign_keys:
    - _no
    - _id
    info_fields:
    - name
    - type
    - status
    - result
    - flag
    - count
    - cnt
    - amt
    - amount
    - rate
    - ratio
    primary_keys:
    - _no
    - _id
    - cust_no
    - apply_no
    - order_no
    - trans_seqno
    time_fields:
    - time
    - date
    - dt
    - datetime
    - timestamp
  max_enum_values: 10
