feature_group: contact_risk_full
stage: preloan
output_table: d_dq.dfs_contact_risk_full_20260708

sample_table:
  preloan: d_dq.dfs_dq_fqz_base_final
  inloan: d_dq.dfs_dz_fqz_base_final
  primary_keys:
    preloan: [cust_no, apply_no]
    inloan: [cust_no, order_no, trans_seqno, rsk_log_id]
  time_field:
    preloan: close_datetime
    inloan: create_datetime
  target_fields: [fpd_k30, if_out_30d, if_out_60d, if_in_30d, if_in_60d]
  partition_field: dt

database:
  account: model_py

data_sources:
  - name: contacts
    table: default.t_bd_cust_relation_info
    join_field: cust_no
    time_field: create_time
    partition_field: dt
    filters:
      - "contact_phone IS NOT NULL"
      - "contact_phone != ''"
  - name: immediate_contacts
    table: default.t_cif_cst_cust_immediate_relation_info
    join_field: cust_no
    time_field: create_time
    partition_field: dt
    filters:
      - "contact_phone IS NOT NULL"

features:
  - name: contact_total_cnt
    desc: "通讯录联系人总数"
    source: contacts
    agg: COUNT_DISTINCT
    field: contact_phone
    window: 365d
  - name: contact_family_cnt
    desc: "家庭关系联系人数量"
    source: contacts
    agg: COUNT_DISTINCT
    field: contact_phone
    condition: "relation_type = 'family'"
    window: 365d
  - name: contact_friend_cnt
    desc: "朋友关系联系人数量"
    source: contacts
    agg: COUNT_DISTINCT
    field: contact_phone
    condition: "relation_type = 'friend'"
    window: 365d
  - name: contact_colleague_cnt
    desc: "同事关系联系人数量"
    source: contacts
    agg: COUNT_DISTINCT
    field: contact_phone
    condition: "relation_type = 'colleague'"
    window: 365d
  - name: immediate_contact_cnt
    desc: "紧急联系人数量"
    source: immediate_contacts
    agg: COUNT_DISTINCT
    field: contact_phone
    window: 365d
  - name: black_contact_cnt
    desc: "黑名单联系人数量"
    source: contacts
    agg: COUNT_DISTINCT
    field: contact_phone
    condition: "is_blacklist = 1"
    window: 365d
  - name: overdue_contact_cnt
    desc: "逾期联系人数量"
    source: contacts
    agg: COUNT_DISTINCT
    field: contact_phone
    condition: "is_overdue = 1"
    window: 365d
  - name: complaint_contact_cnt
    desc: "投诉联系人数量"
    source: contacts
    agg: COUNT_DISTINCT
    field: contact_phone
    condition: "is_complaint = 1"
    window: 365d
  - name: collection_contact_cnt
    desc: "被催收联系人数量"
    source: contacts
    agg: COUNT_DISTINCT
    field: contact_phone
    condition: "is_collection = 1"
    window: 365d
  - name: contact_recent_7d_cnt
    desc: "近7天新增联系人"
    source: contacts
    agg: COUNT_DISTINCT
    field: contact_phone
    window: 7d
  - name: contact_recent_30d_cnt
    desc: "近30天新增联系人"
    source: contacts
    agg: COUNT_DISTINCT
    field: contact_phone
    window: 30d
  - name: contact_recent_90d_cnt
    desc: "近90天新增联系人"
    source: contacts
    agg: COUNT_DISTINCT
    field: contact_phone
    window: 90d
  - name: contact_valid_ratio
    desc: "有效手机号占比"
    source: contacts
    agg: COUNT_DISTINCT
    field: contact_phone
    condition: "LENGTH(contact_phone) = 11"
    window: 365d
  - name: contact_high_risk_flag
    desc: "高风险通讯录标识"
    type: composite
    logic: "CASE WHEN black_contact_cnt > 0 OR overdue_contact_cnt > 5 OR complaint_contact_cnt > 0 THEN 1 ELSE 0 END"
  - name: contact_risk_score_simple
    desc: "简单通讯录风险评分"
    type: composite
    logic: "CAST(COALESCE(black_contact_cnt,0)*3 + COALESCE(overdue_contact_cnt,0)*2 + COALESCE(complaint_contact_cnt,0)*2 AS INT)"

execution:
  drop_first: true
  verify: true
  sample_limit: 20
